<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F9F8F6">
  <script>
    /* Always start in light mode before first paint to avoid a flash */
    document.documentElement.dataset.theme = 'light';
  </script>
  <title>Ibrahim Gana — Eventually, everything connects</title>
  <meta name="description" content="Ibrahim Gana. Design Engineer, Systems Thinker. Builder.">
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23722F37'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23F9F8F6'/%3E%3C/svg%3E">
  <meta property="og:title" content="Ibrahim Gana — Eventually, everything connects">
  <meta property="og:description" content="Design Engineer · Systems Thinker · Builder.">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Skip nav for keyboard users -->
  <a class="skip-link" id="skipLink" href="#homeView">Skip to content</a>

  <!-- Loader -->
  <div class="loader" id="loader" role="status" aria-live="polite" aria-label="Loading">
    <div class="loader-inner">
      <svg class="loader-mark" viewBox="0 0 120 120" aria-hidden="true">
        <g id="loaderLinks"></g>
        <g id="loaderDots"></g>
      </svg>
      <div class="loader-readout">
        <span class="loader-count"><b id="count">00</b><i>%</i></span>
        <span class="loader-rule"><i id="rule"></i></span>
        <span class="loader-label">Establishing connections</span>
      </div>
    </div>
  </div>

  <!-- Hero / Home -->
  <main class="hero" id="homeView" tabindex="-1">

    <!-- Left: Intro -->
    <section class="intro" aria-labelledby="name">
      <h1 class="name" id="name"><span class="name-part">Ibrahim</span> <span class="name-part">Gana</span></h1>
      <p class="roles">Design Engineer &nbsp;·&nbsp; Systems Thinker &nbsp;·&nbsp; Builder</p>
      <h2 class="philosophy">Eventually, <em>everything</em> connects.</h2>
      <a href="mailto:hello@ibrahimgana.com" class="contact-link" aria-label="Send an email to Ibrahim Gana">
        hello@ibrahimgana.com <span aria-hidden="true">↗</span>
      </a>
    </section>

    <!-- Right: Interactive node network -->
    <section class="stage" id="stage" tabindex="-1" aria-label="Interactive network">
      <canvas id="network"
        aria-label="A network of six orbiting nodes: Who Am I, Featured, Notes, Work, The Shelf, and Say Hello."></canvas>

      <!--
        PORTRAIT — replace portrait.jpg with your photo.
        Nodes orbit around this circle, leaving the centre clear.
      -->
      <div class="portrait" aria-hidden="true">
        <img
          src="https://res.cloudinary.com/ibrahimygana/image/upload/w_1000,c_fill,ar_1:1,g_auto,r_max,b_rgb:262c35/v1794010258/oi462t9x0wyopwryvfgc.jpg"
          alt=""
          onerror="this.src='portrait.jpg'; this.onerror=function(){ this.style.display='none'; if(this.nextElementSibling) this.nextElementSibling.style.display='flex'; };">
        <div class="portrait-fallback" style="display:none;">
          <span>IG</span>
        </div>
      </div>

      <div class="labels" id="labels" aria-hidden="true"></div>

      <div class="tooltip" id="tooltip" role="tooltip">
        <h4 id="ttTitle"></h4>
        <p id="ttDesc"></p>
        <button class="tooltip-cta" id="ttCta" type="button">
          <span>Explore</span><span aria-hidden="true">→</span>
        </button>
      </div>

      <p class="stage-hint" id="stageHint" aria-hidden="true">Hover to read · Click to enter</p>
    </section>

  </main>

  <!-- Routed page view -->
  <main class="page" id="page" tabindex="-1" hidden>
    <div class="page-inner" id="pageInner"></div>
  </main>

  <!-- Book Detail Modal -->
  <div class="modal-overlay" id="detailModal" role="dialog" aria-modal="true" aria-label="Book detail">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModals()" aria-label="Close">✕</button>
      <div class="detail-layout">
        <div class="detail-cover"><img id="modalCover" src="" alt=""
            onerror="this.src='https://images.unsplash.com/photo-1544947950-fa07a98d237f?q=80&w=400&auto=format&fit=crop'">
        </div>
        <div class="detail-info">
          <h3 id="modalTitle"></h3>
          <div class="author" id="modalAuthor"></div>
          <div class="takeaway-label">Key takeaway</div>
          <p id="modalTakeaway">A book from my reading collection. Eventually, everything connects.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Add Book Modal -->
  <div class="modal-overlay" id="addModal" role="dialog" aria-modal="true" aria-label="Add a book">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModals()" aria-label="Close">✕</button>
      <h3 style="font-family:var(--serif); font-size:2rem; margin:0 0 24px;">Add a book</h3>
      <form id="addBookForm">
        <div class="form-group"><label>Book Title</label><input type="text" id="inputTitle" required
            placeholder="e.g. The Timeless Way of Building"></div>
        <div class="form-group"><label>Author</label><input type="text" id="inputAuthor" required
            placeholder="e.g. Christopher Alexander"></div>
        <div class="form-group"><label>Cover Image URL</label><input type="url" id="inputCover"
            placeholder="https://..."></div>
        <div class="form-group">
          <label>Status</label>
          <select id="inputStatus">
            <option value="reading">Currently Reading</option>
            <option value="read">Read</option>
            <option value="want">Want to Read</option>
          </select>
        </div>
        <button type="submit" class="form-submit">Add to collection</button>
      </form>
    </div>
  </div>

  <!-- Floating Controls (Bottom-Right) -->
  <div class="floating-controls" id="floatingControls">
    <!-- Background audio toggle -->
    <button class="audio-toggle" id="audioToggle" type="button"
      aria-pressed="false" aria-label="Turn audio on">
      <span class="audio-icon" aria-hidden="true">
        <svg class="audio-icon-off" viewBox="0 0 24 24">
          <path d="M4 9v6h4l5 4V5L8 9H4z" />
          <path d="M16.5 9.5l5 5M21.5 9.5l-5 5" />
        </svg>
        <svg class="audio-icon-on" viewBox="0 0 24 24">
          <path d="M4 9v6h4l5 4V5L8 9H4z" />
          <path d="M16 8.5a5 5 0 0 1 0 7" />
          <path d="M18.8 6a8.6 8.6 0 0 1 0 12" />
        </svg>
      </span>
      <span class="audio-label" id="audioLabel">Audio Off</span>
    </button>

    <!-- Theme Toggle -->
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
      <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2" />
        <path d="M12 2.5v2.8M12 18.7v2.8M2.5 12h2.8M18.7 12h2.8M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2" />
      </svg>
      <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20.6 14.1A8.7 8.7 0 0 1 9.9 3.4a8.7 8.7 0 1 0 10.7 10.7Z" />
      </svg>
    </button>
  </div>

  <!-- Background audio (tracks in audio-tracks.js) -->
  <audio id="siteAudio" loop preload="none" hidden></audio>

  <!-- Mindlines Substack snapshot (refreshed automatically by GitHub Actions) -->
  <script src="substack-articles.js"></script>

  <!-- Background audio track library (edit to add or replace tracks) -->
  <script src="audio-tracks.js"></script>

  <!-- Main Portfolio Scripts -->
  <script src="main.js"></script>
  <script src="site-audio.js"></script>
</body>

</html>
