<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F9F8F6">
  <title>Ibrahim Gana — Eventually, everything connects</title>
  <meta name="description" content="Ibrahim Gana. Design Engineer, Systems Thinker. Builder.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Background Audio -->
  <audio id="bgMusic" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3" type="audio/mpeg">
  </audio>

  <!-- Audio Toggle -->
  <button class="sound-toggle" id="soundToggle" aria-label="Toggle Background Music">
    <span class="sound-icon"></span>
    <span id="soundText">Audio: Off</span>
  </button>

  <!-- Loader -->
  <div class="loader" id="loader" role="status" aria-live="polite" aria-label="Loading">
    <div class="loader-inner">
      <svg class="loader-mark" viewBox="0 0 120 120" aria-hidden="true">
        <g id="loaderLinks"></g>
        <g id="loaderDots"></g>
      </svg>
      <div class="loader-readout">
        <span class="loader-count"><b id="count">00</b><i>%</i></span>
        <span class="loader-rule"><i id="rule"></i></span>
        <span class="loader-label">Establishing connections</span>
      </div>
    </div>
  </div>

  <!-- Hero -->
  <main class="hero">

    <!-- Left: Intro text -->
    <section class="intro" aria-labelledby="name">
      <h1 class="name" id="name">Ibrahim Gana</h1>
      <p class="roles">Design Engineer, Systems Thinker. Builder.</p>
      <h2 class="philosophy">Eventually, <em>everything</em> connects.</h2>
    </section>

    <!-- Right: Interactive node network with portrait placeholder in the centre -->
    <section class="stage" id="stage" aria-label="Interactive network">
      <canvas id="network" aria-label="A network of five nodes orbiting a central portrait: Who Am I?, Notes, Work, The Shelf, and Say Hello."></canvas>

      <!--
        PORTRAIT PLACEHOLDER
        Replace portrait.jpg with your actual photo.
        The nodes and connecting lines orbit around this circle — it stays clear.
      -->
      <div class="portrait">
        <img src="portrait.jpg" alt="Ibrahim Gana">
      </div>

      <div class="labels" id="labels"></div>
      <div class="tooltip" id="tooltip" role="presentation">
        <h4 id="ttTitle"></h4>
        <p id="ttDesc"></p>
        <button class="tooltip-cta" id="ttCta" type="button"><span>Explore</span><span aria-hidden="true">→</span></button>
      </div>
      <p class="stage-hint" id="stageHint" aria-hidden="true">Hover to read · Click to enter</p>
    </section>

  </main>

  <!-- Page Overlay (Dynamic Content) -->
  <div class="page" id="page" hidden role="dialog" aria-modal="true" aria-labelledby="pageTitle">
    <div class="page-inner" id="pageInner">
      <!-- Content injected by main.js -->
    </div>
  </div>

  <!-- Book Detail Modal -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModals()">✕</button>
      <div class="detail-layout">
        <div class="detail-cover"><img id="modalCover" src="" alt=""></div>
        <div class="detail-info">
          <h3 id="modalTitle"></h3>
          <div class="author" id="modalAuthor"></div>
          <p>A selected book from my reading collection. Eventually, everything connects.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Add Book Modal -->
  <div class="modal-overlay" id="addModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModals()">✕</button>
      <h3 style="font-family:var(--serif); font-size:2rem; margin:0 0 24px;">Add a book</h3>
      <form id="addBookForm">
        <div class="form-group"><label>Book Title</label><input type="text" id="inputTitle" required placeholder="e.g. The Timeless Way of Building"></div>
        <div class="form-group"><label>Author</label><input type="text" id="inputAuthor" required placeholder="e.g. Christopher Alexander"></div>
        <div class="form-group"><label>Cover Image URL</label><input type="url" id="inputCover" placeholder="https://..."></div>
        <div class="form-group"><label>Status</label>
          <select id="inputStatus">
            <option value="read">Read</option>
            <option value="want">Want to Read</option>
          </select>
        </div>
        <button type="submit" class="form-submit">Add to collection</button>
      </form>
    </div>
  </div>

  <!-- Keyboard / Accessibility Nav -->
  <nav class="sr-nav" aria-label="Site sections" style="position:fixed; top:-200px; left:0;">
    <a href="#home"    data-nav="home"    style="display:block; padding:10px; background:#fff;">Home</a>
    <a href="#about"   data-nav="about"   style="display:block; padding:10px; background:#fff;">Who Am I?</a>
    <a href="#notes"   data-nav="notes"   style="display:block; padding:10px; background:#fff;">Notes</a>
    <a href="#work"    data-nav="work"    style="display:block; padding:10px; background:#fff;">Work</a>
    <a href="#reading" data-nav="reading" style="display:block; padding:10px; background:#fff;">The Shelf</a>
    <a href="#contact" data-nav="contact" style="display:block; padding:10px; background:#fff;">Say Hello</a>
  </nav>

  <script src="main.js"></script>

</body>

</html>
